site_name: RECITALS Cryptography Manager
site_description: >-
  Differential privacy, encryption and key management for the RECITALS
  platform.
site_url: https://ai-team-uoa.github.io/RECITALS-cryptography-manager/
repo_url: https://github.com/AI-team-UoA/RECITALS-cryptography-manager
repo_name: AI-team-UoA/RECITALS-cryptography-manager
copyright: >-
  Funded by the European Union under Horizon Europe grant No. 101168490.

theme:
  name: material
  logo: assets/recitalslogo.png
  favicon: assets/recitalslogo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The package lives under src/ and is read statically, so the docs
          # build does not import it and needs no optional backend installed.
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 3
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # The narrative pages pull their prose out of README.md rather than copying
  # it, so the repository landing page and the site cannot drift apart.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - REST API: api.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - Roadmap: roadmap.md
  - API Reference:
      - Overview: reference/index.md
      - Adapters: reference/adapters.md
      - Core: reference/core.md
      - Service layer: reference/service.md
      - Configuration: reference/config.md
      - Exceptions: reference/exceptions.md
