name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch; only the newest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned to the uv that produced uv.lock, matching the Dockerfile.
          version: "0.12.7"
          enable-cache: true
          python-version: "3.10"

      - name: Install the documentation toolchain
        # mkdocstrings reads the source statically, so the package itself and
        # the optional cryptographic backends are not needed here.
        run: uv sync --frozen --only-group docs

      - name: Build
        # --strict turns a broken cross-reference or a missing snippet into a
        # failure, so documentation rot is caught on the pull request.
        run: uv run --no-sync mkdocs build --strict

      - name: Upload the site
        # Pull requests build to prove the docs still compile, but only main
        # produces an artifact that the deploy job publishes.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
